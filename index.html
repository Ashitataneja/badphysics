<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030409" />
    <meta name="description" content="BAD PHYSICS — your body is the bug. A webcam-controlled 3D installation." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030409'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23e9e4d8' stroke-width='2'/%3E%3Cpath d='M4 26 L28 6' stroke='%23c6f432' stroke-width='2'/%3E%3C/svg%3E" />
    <title>BAD PHYSICS</title>
    <style>
      html, body { margin: 0; background: #030409; color: #e9e4d8; }
      #boot { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 24px; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; text-align: center; }
      #boot div { max-width: 560px; }
      #boot b { display: block; font: 700 28px/1.2 'Helvetica Neue', Arial, sans-serif; margin-bottom: 12px; }
      #boot code { color: #c6f432; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="alert"><div></div></div>
    <script>
      // Never leave a silent blank page: explain why the app did not start.
      (function () {
        var boot = document.getElementById('boot');
        function show(html) {
          if (window.__badPhysicsMounted) return;
          boot.firstChild.innerHTML = '<b>Reality failed to load.</b>' + html;
          boot.style.display = 'flex';
        }
        window.__badPhysicsBootError = show;
        if (location.protocol === 'file:') {
          show('This page was opened directly from disk, which browsers block for module scripts and cameras.<br><br>' +
            'In the project folder run <code>npm install</code> then <code>npm run dev</code>, and open <code>http://localhost:5173</code>.');
          return;
        }
        window.addEventListener('error', function (e) {
          var src = e.target && (e.target.src || e.target.href);
          show(src ? 'Could not load <code>' + src + '</code>. If you are hosting the built files, serve the whole <code>dist/</code> folder.'
                   : 'Startup error: <code>' + String(e.message || e.error) + '</code>');
        }, true);
        setTimeout(function () {
          show('The app script did not start. Check the browser console, and make sure you are running <code>npm run dev</code> ' +
            'or serving the built <code>dist/</code> folder over http.');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
